# pr-policy configuration, generated by `pr-policy init` on 2026-09-12.
#
# Rules switched on by inference quote the line that justified them, so you can
# check the reasoning rather than take it on trust. Everything here is a
# starting point — edit it freely.
#
# Severities are `error`, `warn` or `info`. Nothing fails a build while
# `enforce` is false: pr-policy reports signals and leaves the decision to you.

version: 1
enforce: false

rules:

  attribution:
    enabled: true
    severity: "warn"
    forbid_agent_sign_off: true
    prefer_assisted_by: true
    require_signed_off: false

  disclosure:
    # CONTRIBUTING.md:38 — "You may use AI tools here."
    enabled: true
    severity: "warn"

  template:
    enabled: true
    severity: "warn"
    min_body_chars: 30

  linked_issue:
    enabled: false
    severity: "warn"

  size:
    enabled: true
    severity: "info"
    max_lines: 1000
    max_files: 100
