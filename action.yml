name: pr-policy gate
description: Reduce low-effort and drive-by PRs with checks your project writes down. Warns by default. No AI detection.
author: rodny90

branding:
  icon: check-square
  color: blue

inputs:
  config:
    description: Path to pr-policy.yml. Defaults to the conventional locations.
    required: false
    default: ""
  base:
    description: Base ref to compare against. Defaults to the pull request's base branch.
    required: false
    default: ""
  strict:
    description: Fail the job on error findings even if the config does not enforce.
    required: false
    default: "false"
  comment:
    description: Post the findings as a sticky comment on the pull request.
    required: false
    default: "true"
  python-version:
    description: Python version used to run pr-policy.
    required: false
    default: "3.12"

outputs:
  exit-code:
    description: 0 when the policy passed or is reporting-only, 1 when enforcement failed, 2 on a bad configuration, revision or missing base.
    value: ${{ steps.check.outputs.exit-code }}
  findings:
    description: The findings as JSON.
    value: ${{ steps.check.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pr-policy
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Check the pull request
      id: check
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        BASE_REF: ${{ github.base_ref }}
        CONFIG: ${{ inputs.config }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -uo pipefail

        if [ -n "$BASE" ]; then
          base="$BASE"
        elif [ -n "$BASE_REF" ]; then
          # A shallow checkout has no remote-tracking ref for the base branch,
          # and `git fetch origin <branch>` alone does not create one. The
          # explicit refspec does, which is what `base` below resolves against.
          git fetch --quiet --depth=50 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
          base="origin/${BASE_REF}"
        else
          echo "::error::No base ref. Set the 'base' input outside a pull request." >&2
          exit 2
        fi

        args=(check --base "$base")
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi

        # Files from an earlier run on a self-hosted runner must not be mistaken
        # for this run's result.
        rm -f policy-comment.md policy-findings.json

        # Human-readable in the job log, and the exit code that decides the job.
        pr-policy "${args[@]}"
        code=$?

        pr-policy "${args[@]}" --format markdown > policy-comment.md || true
        pr-policy "${args[@]}" --format json > policy-findings.json || true

        # An empty file means the renderer failed (exit code 2 is already
        # reported above). Remove it so the comment step has nothing to post
        # rather than a bare marker that would overwrite a good comment.
        if [ ! -s policy-comment.md ]; then
          rm -f policy-comment.md
          if [ "$code" -ne 2 ]; then
            echo "::warning::pr-policy could not render its markdown report; no comment will be posted."
          fi
        fi

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        {
          echo "findings<<PR_POLICY_EOF"
          cat policy-findings.json
          echo "PR_POLICY_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        marker="<!-- pr-policy -->"

        # No report means the check failed before it could render one (a bad
        # config, say). Posting just the marker would overwrite a good comment.
        if [ ! -s policy-comment.md ]; then
          echo "::notice::pr-policy produced no report, so there is no comment to post."
          exit 0
        fi
        printf '%s\n' "$marker" >> policy-comment.md

        post_comment() {
          # Update the existing comment rather than adding one per push. Only the
          # bot's own comment counts, so a user quoting the marker is never
          # edited, and only the first match is used.
          ids=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq \
            ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id") \
            || return 1
          existing=$(printf '%s\n' "$ids" | head -n 1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -F body=@policy-comment.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" \
              -F body=@policy-comment.md >/dev/null
          fi
        }

        # The comment is a convenience. The job's result is decided by the check
        # step's exit code alone, so a comment that cannot be written must not
        # fail the job. Pull requests from forks get a read-only token (HTTP 403).
        if ! post_comment; then
          echo "::warning title=pr-policy could not post its comment::" \
            "The token cannot write to this pull request, which is expected for" \
            "pull requests from forks (their GITHUB_TOKEN is read-only)." \
            "The findings are in the job log and the 'findings' output. To get a" \
            "comment on fork pull requests, post it from a separate 'workflow_run'" \
            "workflow (see the README), or set 'comment: false' to silence this."
        fi

    - name: Apply the result
      shell: bash
      run: exit ${{ steps.check.outputs.exit-code }}
